# A real federation on one host: one coordinator, one operator and five silo containers.
#
# The point of the layout is what is *not* shared. Each silo gets exactly one bind mount -- its
# own identity file -- plus the public roster. There is no shared volume anywhere, so a silo's
# rows (generated inside the container from its seed) cannot reach another container even by
# accident, and a compromised silo cannot read another silo's private key.
#
# Before the first run, generate key material outside the image. One API key per identity:
# a shared key would let any silo open rounds and drive stage advances, and would put all six
# processes in one rate-limit bucket (the bucket is keyed on the presented key), so six normal
# pollers would look like a flood and the coordinator would 429 its own federation.
#
#   uv run python scripts/generate_identities.py --silos 5   # writes secrets/, including .env
#   set -a && . ./secrets/compose.env && set +a              # exports the six keys + digests
#   docker compose up --build
#
# `generate_identities.py` writes secrets/compose.env with APP_OPERATOR_API_KEY, APP_SILO_NN_API_KEY
# and the two digest lists the coordinator needs.
#
# Only locally built images; nothing is pulled at runtime besides the pinned bases.

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp:size=16m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 128
  mem_limit: 256m
  cpus: 1.0

x-silo: &silo
  image: federated-secure-aggregation:local
  depends_on:
    coordinator:
      condition: service_healthy
  networks: [federation]
  restart: "no"
  <<: *hardening

services:
  coordinator:
    build:
      context: .
    image: federated-secure-aggregation:local
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENVIRONMENT: prod
      APP_LOG_LEVEL: INFO
      # Comma-separated SHA-256 digests, split by role. The silo list holds five digests,
      # one per silo; the operator list holds one. A digest may not appear in both.
      APP_API_KEY_SHA256: ${APP_SILO_API_KEY_SHA256:?run scripts/generate_identities.py}
      APP_OPERATOR_API_KEY_SHA256: ${APP_OPERATOR_API_KEY_SHA256:?run scripts/generate_identities.py}
      # The limit is per authenticated key. Six identities each poll the round status about
      # four times a second (poll_seconds = 0.25), so 50/s with a burst of 200 leaves roughly
      # 2x headroom per identity. Leaving the 5/s default here 429s the federation to death.
      APP_RATE_LIMIT_PER_SECOND: "50"
      APP_RATE_LIMIT_BURST: "200"
      APP_MODEL_DIMENSION: "13"
      APP_SECAGG_THRESHOLD: "3"
      APP_CLIP_NORM: "1.0"
      # Central DP over the aggregate. The multiplier is calibrated so that 20 rounds spend
      # exactly the target epsilon:
      #   uv run python -c "from federated_secure_aggregation.privacy.accountant import       #     calibrate_noise_multiplier; print(calibrate_noise_multiplier(
      #     target_epsilon=8.0, delta=1e-5, steps=20, sample_rate=1.0))"  -> 2.8536
      # Run more rounds than that and the ledger refuses to open them, which is the point.
      APP_NOISE_MULTIPLIER: "2.8536"
      APP_TARGET_EPSILON: "8.0"
      APP_TARGET_DELTA: "0.00001"
      APP_DATA_DIR: /var/lib/fedsecagg
      # Long enough that a slow silo is not dropped, short enough that a dead one does not
      # stall the round for ever. A stage closes when everyone answers or this elapses.
      APP_STAGE_TIMEOUT_SECONDS: "20"
      APP_COORDINATOR_IDENTITY_PATH: /run/secrets/coordinator_identity.json
      APP_ROSTER_PATH: /run/secrets/roster.json
    volumes:
      - ./secrets/coordinator_identity.json:/run/secrets/coordinator_identity.json:ro
      - ./secrets/roster.json:/run/secrets/roster.json:ro
      # The one writable path: the budget ledger survives a restart, so the epsilon the
      # coordinator reports is a statement about the data and not about its uptime.
      - coordinator-state:/var/lib/fedsecagg
    networks: [federation]
    restart: unless-stopped
    <<: *hardening

  # Opens rounds and asks the coordinator to advance stages. Holds no key material and never
  # sees an update: its only power is asking, and the coordinator refuses until every silo has
  # answered or the stage timed out.
  operator:
    image: federated-secure-aggregation:local
    depends_on:
      coordinator:
        condition: service_healthy
    environment:
      APP_API_KEY: ${APP_OPERATOR_API_KEY:?run scripts/generate_identities.py}
      APP_LOG_LEVEL: INFO
    command: ["operate", "--coordinator", "http://coordinator:8000", "--rounds", "20"]
    networks: [federation]
    restart: "no"
    <<: *hardening

  silo-00:
    <<: *silo
    environment:
      APP_API_KEY: ${APP_SILO_00_API_KEY:?run scripts/generate_identities.py}
      APP_LOG_LEVEL: INFO
    command: ["silo", "silo_00", "--identity", "/run/secrets/identity.json", "--roster", "/run/secrets/roster.json", "--rounds", "20"]
    volumes:
      - ./secrets/silo_00_identity.json:/run/secrets/identity.json:ro
      - ./secrets/roster.json:/run/secrets/roster.json:ro

  silo-01:
    <<: *silo
    environment:
      APP_API_KEY: ${APP_SILO_01_API_KEY:?run scripts/generate_identities.py}
      APP_LOG_LEVEL: INFO
    command: ["silo", "silo_01", "--identity", "/run/secrets/identity.json", "--roster", "/run/secrets/roster.json", "--rounds", "20"]
    volumes:
      - ./secrets/silo_01_identity.json:/run/secrets/identity.json:ro
      - ./secrets/roster.json:/run/secrets/roster.json:ro

  silo-02:
    <<: *silo
    environment:
      APP_API_KEY: ${APP_SILO_02_API_KEY:?run scripts/generate_identities.py}
      APP_LOG_LEVEL: INFO
    command: ["silo", "silo_02", "--identity", "/run/secrets/identity.json", "--roster", "/run/secrets/roster.json", "--rounds", "20"]
    volumes:
      - ./secrets/silo_02_identity.json:/run/secrets/identity.json:ro
      - ./secrets/roster.json:/run/secrets/roster.json:ro

  silo-03:
    <<: *silo
    environment:
      APP_API_KEY: ${APP_SILO_03_API_KEY:?run scripts/generate_identities.py}
      APP_LOG_LEVEL: INFO
    command: ["silo", "silo_03", "--identity", "/run/secrets/identity.json", "--roster", "/run/secrets/roster.json", "--rounds", "20"]
    volumes:
      - ./secrets/silo_03_identity.json:/run/secrets/identity.json:ro
      - ./secrets/roster.json:/run/secrets/roster.json:ro

  silo-04:
    <<: *silo
    environment:
      APP_API_KEY: ${APP_SILO_04_API_KEY:?run scripts/generate_identities.py}
      APP_LOG_LEVEL: INFO
    command: ["silo", "silo_04", "--identity", "/run/secrets/identity.json", "--roster", "/run/secrets/roster.json", "--rounds", "20"]
    volumes:
      - ./secrets/silo_04_identity.json:/run/secrets/identity.json:ro
      - ./secrets/roster.json:/run/secrets/roster.json:ro

volumes:
  coordinator-state:

networks:
  # Internal only: the silos talk to the coordinator and to nothing else. The coordinator's
  # port is published on loopback for operator tooling, not on the network.
  federation:
    driver: bridge
