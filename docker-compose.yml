# A real federation on one host: one coordinator, one operator and five silo containers.
#
# The point of the layout is what is *not* shared. Each silo gets exactly one bind mount -- its
# own identity file -- plus the public roster. There is no shared volume anywhere, so a silo's
# rows (generated inside the container from its seed) cannot reach another container even by
# accident, and a compromised silo cannot read another silo's private key.
#
# Before the first run, generate key material outside the image:
#
#   uv run python scripts/generate_identities.py --silos 5
#   uv run federated-secure-aggregation generate-api-key      # note both values
#   export APP_API_KEY=<key> APP_API_KEY_SHA256=<digest>
#   docker compose up --build
#
# Only locally built images; nothing is pulled at runtime besides the pinned bases.

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp:size=16m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 128
  mem_limit: 256m
  cpus: 1.0

x-silo: &silo
  image: federated-secure-aggregation:local
  depends_on:
    coordinator:
      condition: service_healthy
  environment:
    APP_API_KEY: ${APP_API_KEY:?generate one with `generate-api-key`}
    APP_LOG_LEVEL: INFO
  networks: [federation]
  restart: "no"
  <<: *hardening

services:
  coordinator:
    build:
      context: .
    image: federated-secure-aggregation:local
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENVIRONMENT: prod
      APP_LOG_LEVEL: INFO
      # Comma-separated SHA-256 digests; generate with `generate-api-key`.
      APP_API_KEY_SHA256: ${APP_API_KEY_SHA256:?generate one with `generate-api-key`}
      APP_MODEL_DIMENSION: "13"
      APP_SECAGG_THRESHOLD: "3"
      APP_CLIP_NORM: "1.0"
      # Long enough that a slow silo is not dropped, short enough that a dead one does not
      # stall the round for ever. A stage closes when everyone answers or this elapses.
      APP_STAGE_TIMEOUT_SECONDS: "20"
      APP_COORDINATOR_IDENTITY_PATH: /run/secrets/coordinator_identity.json
      APP_ROSTER_PATH: /run/secrets/roster.json
    volumes:
      - ./secrets/coordinator_identity.json:/run/secrets/coordinator_identity.json:ro
      - ./secrets/roster.json:/run/secrets/roster.json:ro
    networks: [federation]
    restart: unless-stopped
    <<: *hardening

  # Opens rounds and asks the coordinator to advance stages. Holds no key material and never
  # sees an update: its only power is asking, and the coordinator refuses until every silo has
  # answered or the stage timed out.
  operator:
    image: federated-secure-aggregation:local
    depends_on:
      coordinator:
        condition: service_healthy
    environment:
      APP_API_KEY: ${APP_API_KEY:?generate one with `generate-api-key`}
      APP_LOG_LEVEL: INFO
    command: ["operate", "--coordinator", "http://coordinator:8000", "--rounds", "20"]
    networks: [federation]
    restart: "no"
    <<: *hardening

  silo-00:
    <<: *silo
    command: ["silo", "silo_00", "--identity", "/run/secrets/identity.json", "--roster", "/run/secrets/roster.json", "--rounds", "20"]
    volumes:
      - ./secrets/silo_00_identity.json:/run/secrets/identity.json:ro
      - ./secrets/roster.json:/run/secrets/roster.json:ro

  silo-01:
    <<: *silo
    command: ["silo", "silo_01", "--identity", "/run/secrets/identity.json", "--roster", "/run/secrets/roster.json", "--rounds", "20"]
    volumes:
      - ./secrets/silo_01_identity.json:/run/secrets/identity.json:ro
      - ./secrets/roster.json:/run/secrets/roster.json:ro

  silo-02:
    <<: *silo
    command: ["silo", "silo_02", "--identity", "/run/secrets/identity.json", "--roster", "/run/secrets/roster.json", "--rounds", "20"]
    volumes:
      - ./secrets/silo_02_identity.json:/run/secrets/identity.json:ro
      - ./secrets/roster.json:/run/secrets/roster.json:ro

  silo-03:
    <<: *silo
    command: ["silo", "silo_03", "--identity", "/run/secrets/identity.json", "--roster", "/run/secrets/roster.json", "--rounds", "20"]
    volumes:
      - ./secrets/silo_03_identity.json:/run/secrets/identity.json:ro
      - ./secrets/roster.json:/run/secrets/roster.json:ro

  silo-04:
    <<: *silo
    command: ["silo", "silo_04", "--identity", "/run/secrets/identity.json", "--roster", "/run/secrets/roster.json", "--rounds", "20"]
    volumes:
      - ./secrets/silo_04_identity.json:/run/secrets/identity.json:ro
      - ./secrets/roster.json:/run/secrets/roster.json:ro

networks:
  # Internal only: the silos talk to the coordinator and to nothing else. The coordinator's
  # port is published on loopback for operator tooling, not on the network.
  federation:
    driver: bridge
